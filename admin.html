<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Chkobba</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #2b2b2b; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #ff8c00; }
        .card { background: #3c3c3c; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 4px; border: none; }
        input { width: calc(100% - 22px); background: #555; color: white; }
        button { background: #ff8c00; color: #111; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background: #e07b00; }
        .btn-action { width: auto; padding: 5px 10px; font-size: 0.9em; margin: 2px; }
        .plus { background: #2e8b57; color: white; }
        .minus { background: #dc143c; color: white; }
        .logout-btn { background: #555; color: white; margin-top: 10px; }
        .joueur-admin { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #555; }
        .historique-item { font-size: 0.85em; padding: 5px 0; border-bottom: 1px dashed #555; display: flex; justify-content: space-between; }
        .pts-plus { color: #4ade80; }
        .pts-minus { color: #f87171; }
    </style>
</head>
<body>
<div class="container">
    <h1>⚙️ Admin Chkobba</h1>

    <div id="login-section" class="card">
        <h2>Connexion</h2>
        <input type="email" id="email" placeholder="Email admin" required>
        <input type="password" id="password" placeholder="Mot de passe" required>
        <button onclick="login()">Se connecter</button>
        <p id="login-error" style="color: #ff6b6b; font-size: 0.9em;"></p>
    </div>

    <div id="admin-panel" style="display: none;">
        <div class="card">
            <h2>👥 Gestion des Joueurs</h2>
            <div id="liste-joueurs-admin">Chargement...</div>
        </div>

        <div class="card">
            <h2>📜 Historique Complet</h2>
            <div id="liste-historique-admin">Chargement...</div>
        </div>

        <button class="logout-btn" onclick="logout()">Déconnexion</button>
    </div>
</div>

<script>
    const supabaseUrl = 'https://xcngfsaepvplxkyssuji.supabase.co'; // Ton URL corrigée
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhjbmdmc2FlcHZwbHhreXNzdWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDc4MDMsImV4cCI6MjEwNjI4MzgwM30.Sa6niP0WPImXVxmxS8nok2WwVy8OYV6E6uOQjdgrhLE'; // Utilise bien la clé publique "anon"

    const db = supabase.createClient(supabaseUrl, supabaseKey, {
        db: { schema: 'chkobba' }
    });

    db.auth.getSession().then(({ data: { session } }) => {
        if (session) afficherAdmin();
    });

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorP = document.getElementById('login-error');

        const { data, error } = await db.auth.signInWithPassword({ email, password });

        if (error) {
            errorP.innerText = "Identifiants incorrects.";
        } else {
            afficherAdmin();
        }
    }

    async function logout() {
        await db.auth.signOut();
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('admin-panel').style.display = 'none';
    }

    function afficherAdmin() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        chargerJoueursAdmin();
        chargerHistoriqueAdmin();
    }

    async function chargerJoueursAdmin() {
        const listeDiv = document.getElementById('liste-joueurs-admin');

        const { data: joueurs, error } = await db
            .from('joueurs')
            .select('*')
            .order('score', { ascending: false })
            .order('matchs_joues', { ascending: true });

        if (error) return;

        listeDiv.innerHTML = '';
        joueurs.forEach(joueur => {
            const div = document.createElement('div');
            div.className = 'joueur-admin';

            div.innerHTML = `
                    <div>
                        <strong>${joueur.nom}</strong><br>
                        <span style="font-size: 0.85em; color: #aaa;">${joueur.score} pts | ${joueur.matchs_joues} matchs</span>
                    </div>
                    <div class="actions-btn" style="display: flex; align-items: center; flex-wrap: wrap; gap: 5px; justify-content: flex-end;">
                        <button class="btn-action minus" onclick="modifierScore('${joueur.id}', ${joueur.score}, -1, ${joueur.matchs_joues})">-1 pt</button>
                        <button class="btn-action plus" onclick="modifierScore('${joueur.id}', ${joueur.score}, 1, ${joueur.matchs_joues})">+1 pt</button>
                        <button class="btn-action plus" onclick="modifierScore('${joueur.id}', ${joueur.score}, 2, ${joueur.matchs_joues})">+2</button>
                        <button class="btn-action plus" onclick="modifierScore('${joueur.id}', ${joueur.score}, 3, ${joueur.matchs_joues})">+3</button>

                        <span style="color: #666; margin: 0 5px;">|</span>

                        <button class="btn-action minus" onclick="modifierMatchs('${joueur.id}', ${joueur.matchs_joues}, -1)">-1 ⚔️</button>
                        <button class="btn-action plus" onclick="modifierMatchs('${joueur.id}', ${joueur.matchs_joues}, 1)">+1 ⚔️</button>
                    </div>
                `;
            listeDiv.appendChild(div);
        });
    }

    async function chargerHistoriqueAdmin() {
        const listeHistDiv = document.getElementById('liste-historique-admin');

        const { data: actions, error } = await db
            .from('historique')
            .select('points_modifies, date_action, joueurs(nom)')
            .order('date_action', { ascending: false })
            .limit(10);

        if (error) return;

        listeHistDiv.innerHTML = '';
        actions.forEach(action => {
            const div = document.createElement('div');
            div.className = 'historique-item';

            const date = new Date(action.date_action);
            const dateStr = date.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute:'2-digit' });

            const pts = action.points_modifies;
            const classPts = pts > 0 ? 'pts-plus' : 'pts-minus';
            const sign = pts > 0 ? '+' : '';
            const nom = action.joueurs ? action.joueurs.nom : 'Joueur inconnu';

            div.innerHTML = `
                    <span class="date">${dateStr}</span>
                    <span><span class="${classPts}">${sign}${pts} pts</span> pour <strong>${nom}</strong></span>
                `;
            listeHistDiv.appendChild(div);
        });
    }

    async function modifierScore(idCible, scoreActuel, pointsAjoutes, matchsActuels) {
        const nouveauScore = scoreActuel + pointsAjoutes;

        let nouveauxMatchs = matchsActuels;
        if (pointsAjoutes > 0) {
            nouveauxMatchs += 1;
        }

        const { error: errorUpdate } = await db
            .from('joueurs')
            .update({ score: nouveauScore, matchs_joues: nouveauxMatchs })
            .eq('id', idCible);

        if (errorUpdate) return alert("Erreur : " + errorUpdate.message);

        await db.from('historique').insert({ joueur_id: idCible, points_modifies: pointsAjoutes });

        chargerJoueursAdmin();
        chargerHistoriqueAdmin();
    }

    async function modifierMatchs(idCible, matchsActuels, ajout) {
        const nouveauxMatchs = matchsActuels + ajout;

        const { error } = await db
            .from('joueurs')
            .update({ matchs_joues: nouveauxMatchs })
            .eq('id', idCible);

        if (error) return alert("Erreur : " + error.message);

        chargerJoueursAdmin();
    }
</script>
</body>
</html>
