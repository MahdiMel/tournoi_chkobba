<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♦️Tournoi de Chkobba♦️</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            background-image:
                    linear-gradient(135deg, #ffb6c1 25%, transparent 25%),
                    linear-gradient(225deg, #ffb6c1 25%, transparent 25%),
                    linear-gradient(45deg, #ffb6c1 25%, transparent 25%),
                    linear-gradient(315deg, #ffb6c1 25%, #fff0f5 25%);
            background-position:  10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            background-repeat: repeat;

            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { text-align: center; color: #dc143c; margin-bottom: 30px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #ffccd5; }
        h2 { margin-top: 0; color: #800000; font-size: 1.2em; border-bottom: 2px solid #ffccd5; padding-bottom: 10px; }
        .joueur { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .joueur:last-child { border-bottom: none; }
        .nom { font-weight: bold; font-size: 1.1em; }
        .score { font-weight: bold; color: #dc143c; font-size: 1.2em; }
        .historique-item { font-size: 0.9em; padding: 8px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; }
        .date { color: #888; font-size: 0.85em; }
        .pts-plus { color: #2e8b57; font-weight: bold; }
        .pts-minus { color: #dc143c; font-weight: bold; }
        .statut-connexion { text-align: center; font-size: 0.8em; color: #888; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>♦️ Classement Chkobba</h1>

    <div class="card">
        <h2>🏆 Leaderboard</h2>
        <div id="liste-joueurs">Chargement du classement...</div>
    </div>

    <div class="card">
        <h2>📜 Dernières actions</h2>
        <div id="liste-historique">Chargement de l'historique...</div>
    </div>

    <div id="statut" class="statut-connexion">🔴 Connexion au serveur en cours...</div>
</div>

<script>
    const supabaseUrl = 'https://xcngfsaepvplxkyssuji.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhjbmdmc2FlcHZwbHhreXNzdWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDc4MDMsImV4cCI6MjEwNjI4MzgwM30.Sa6niP0WPImXVxmxS8nok2WwVy8OYV6E6uOQjdgrhLE'; // Utilise bien la clé publique "anon"

    const db = supabase.createClient(supabaseUrl, supabaseKey, {
        db: { schema: 'chkobba' }
    });

    async function chargerClassement() {
        const listeJoueursDiv = document.getElementById('liste-joueurs');

        const { data: joueurs, error } = await db
            .from('joueurs')
            .select('*')
            .order('score', { ascending: false })
            .order('matchs_joues', { ascending: true });

        if (error) {
            listeJoueursDiv.innerHTML = `<p style="color:red;">Erreur: ${error.message}</p>`;
            return;
        }

        listeJoueursDiv.innerHTML = '';

        joueurs.forEach((joueur, index) => {
            const div = document.createElement('div');
            div.className = 'joueur';

            let icone = index === 0 ? '👑 ' : `<span style="font-size: 0.8em; color: #dc143c;">♦️ </span>`;

            div.innerHTML = `
                    <span class="nom">
                        ${icone}${joueur.nom}
                        <span style="font-size: 0.75em; color: #888; margin-left: 8px; font-weight: normal;">(⚔️ ${joueur.matchs_joues} matchs)</span>
                    </span>
                    <span class="score">${joueur.score} pts</span>
                `;
            listeJoueursDiv.appendChild(div);
        });
    }

    async function chargerHistorique() {
        const listeHistDiv = document.getElementById('liste-historique');

        const { data: actions, error } = await db
            .from('historique')
            .select('points_modifies, date_action, joueurs(nom)')
            .order('date_action', { ascending: false })
            .limit(5);

        if (error) return;

        listeHistDiv.innerHTML = '';
        if (!actions || actions.length === 0) {
            listeHistDiv.innerHTML = '<p style="text-align:center; color:#888;">Aucune activité récente.</p>';
            return;
        }

        actions.forEach(action => {
            const div = document.createElement('div');
            div.className = 'historique-item';

            const date = new Date(action.date_action);
            const dateStr = date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute:'2-digit' });

            const pts = action.points_modifies;
            const classPts = pts > 0 ? 'pts-plus' : 'pts-minus';
            const sign = pts > 0 ? '+' : '';
            const nom = action.joueurs ? action.joueurs.nom : 'Inconnu';

            div.innerHTML = `
                    <span><span class="${classPts}">${sign}${pts} pts</span> pour <strong>${nom}</strong></span>
                    <span class="date">${dateStr}</span>
                `;
            listeHistDiv.appendChild(div);
        });
    }

    function configurerRealtime() {
        db.channel('public:chkobba')
            .on('postgres_changes', { event: '*', schema: 'chkobba', table: 'joueurs' }, payload => {
                chargerClassement();
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'chkobba', table: 'historique' }, payload => {
                chargerHistorique();
            })
            .subscribe((status) => {
                const statutDiv = document.getElementById('statut');
                if (status === 'SUBSCRIBED') {
                    statutDiv.innerHTML = '🟢 Connecté en temps réel';
                    statutDiv.style.color = '#2e8b57';
                }
            });
    }

    chargerClassement();
    chargerHistorique();
    configurerRealtime();
</script>
</body>
</html>
